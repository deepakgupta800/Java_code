spring:
  application:
    name: RatingService
  data:
    mongodb:
      uri: mongodb://deepak:gupta@localhost:27017/Rating-service?authSource=admin

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

server:
  port: 8086