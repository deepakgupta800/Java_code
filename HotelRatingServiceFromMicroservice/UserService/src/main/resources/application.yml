server:
  port: 8084

spring:
  application:
    name: UserService

  datasource:
    url: jdbc:mysql://localhost:3306/Microservice-practice
    username: deepak_gupta
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

logging:
  level:
    org:
      springframework:
        security: DEBUG


management:
  health:
    circuit breakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health


endpoints:
  health:
    show-details: always

