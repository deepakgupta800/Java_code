    instances:
      ratingHotelBreaker:
        max-attempts: 3
        wait-duration: 1s
  ratelimiter:
    instances:
      ratingHotelService:
        limit-for-period: 5
        limit-refresh-period: 2s
        timeout-duration: 10s
        register-health-indicator: true
