openapi: 3.0.3

info:
  title: User API
  version: 1.0.0
  description: API for saving and retrieving user data

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /users:
    post:
      summary: Save a new user
      operationId: saveUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User2Dto'

    get:
      summary: Get all users
      operationId: getAllUsers
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'


  /users/{id}:
    get:
      summary: Get user by userId
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Data of user
          content:
            application/json:
              schema:
                type: array
                items:
                 $ref: '#/components/schemas/User'



components:
  schemas:
    User:
      type: object
      description: User entity schema
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string

    User2Dto:
      type: object
      description: User response schema
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string